[project]
name = "replypilot"
version = "0.1.0"
description = "Human-approved Gmail reply drafting with LangGraph, LangSmith, and Hermes MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.160,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "keyring>=25,<26",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langsmith>=0.3.13,<1",
  "mcp>=1.12,<2",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
replypilot-api = "replypilot.api:main"
replypilot-mcp = "replypilot.mcp_server:main"
replypilot-google-auth = "replypilot.gmail.google:authorize_cli"
replypilot-eval = "replypilot.evals:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replypilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
